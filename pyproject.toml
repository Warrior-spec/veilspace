[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "veilspace-server"
version = "0.1.0"
description = "VeilSpace document privacy workspace backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
veilspace-server = "veilspace.launcher:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]
